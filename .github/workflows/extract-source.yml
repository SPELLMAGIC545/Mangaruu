name: Extract Mangaruu source for development
on:
  push:
    paths:
      - '.github/workflows/extract-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source into repository
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq mangaruu-mihon-source.zip 'src/*' -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m 'Extract extension source for feature development'
            git push
          fi
