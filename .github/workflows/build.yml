name: Build Mangaruu APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'mangaruu-mihon-source.zip'
      - 'src/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t mangaruu-mihon-source.zip
          mkdir -p source
          unzip -q mangaruu-mihon-source.zip -d source
          test -f source/src/ja/mangaruu/build.gradle.kts
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream
          git -C upstream fetch --depth 1 origin dbf6c05d6a9520c60533f1626616263522bbe71a
          git -C upstream checkout --detach FETCH_HEAD
          mkdir -p upstream/src/ja/mangaruu
          cp -a source/src/ja/mangaruu/. upstream/src/ja/mangaruu/
          # Checked-in sources override the original ZIP so improvements are built.
          if [ -d src/ja/mangaruu ]; then cp -a src/ja/mangaruu/. upstream/src/ja/mangaruu/; fi
          sed -i 's@^loadAllIndividualExtensions()@// loadAllIndividualExtensions()@; s@^// loadIndividualExtension("all", "mangadex")@loadIndividualExtension("ja", "mangaruu")@' upstream/settings.gradle.kts
          grep -n -F 'loadIndividualExtension("ja", "mangaruu")' upstream/settings.gradle.kts
      - name: Build extension
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :src:ja:mangaruu:spotlessApply --no-daemon
          # Hosted CI receives 403 for chapter HTML. Use the recorded metadata,
          # but require successful live downloads and decoding of all 33 plain CDN images and 28 canva2 CDN images.
          MANGARUU_LIVE_TEST=1 MANGARUU_CAPTURED_METADATA=1 ./gradlew :src:ja:mangaruu:testDebugUnitTest --stacktrace --no-daemon
          python - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as E
          expected = {'ReaderTest': 3, 'ChapterLabelTest': 2, 'Canva2Test': 2, 'Canva2ImageInterceptorTest': 3}
          roots = {E.parse(p).getroot().get('name').rsplit('.', 1)[-1]: E.parse(p).getroot() for p in pathlib.Path('src/ja/mangaruu/build/test-results/testDebugUnitTest').glob('TEST-*.xml')}
          for name, count in expected.items():
              r = roots[name]
              assert int(r.get('tests')) == count and all(r.get(k) == '0' for k in ['failures', 'errors', 'skipped']), r.attrib
          print('Verified 10 tests, zero failures/errors/skips, including both live image checks')
          PYTEST
          ./gradlew :src:ja:mangaruu:assembleDebug --stacktrace --no-daemon
          ./gradlew :src:ja:mangaruu:lintRelease --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mangaruu-apk
          path: upstream/src/ja/mangaruu/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaruu-verification
          path: |
            upstream/src/ja/mangaruu/build/test-results/testDebugUnitTest/**
            upstream/src/ja/mangaruu/build/reports/tests/testDebugUnitTest/**
            upstream/src/ja/mangaruu/build/reports/lint-results-release.*
          if-no-files-found: warn
